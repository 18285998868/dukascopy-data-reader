# 单品种单周期配置 (Dukascopy)
#
# 目录约定 (重要): dir 是数据根目录, 程序自动追加 dukascopy/{symbol}/,
#   {dir}/dukascopy/{symbol}/{YYYY}[/{MM}[/{DD}]]/{BID|ASK}_candles_{min_1|hour_1|day_1}.bi5
# 因此不要把子路径写进 dir.
#
# 日期语义均为 UTC; end_date 含当日整天.
dir = "path/to/data" # 数据根目录, 必填
symbol = "EURUSD" # 品种, 必填
timeframe = "D1" # 时间帧, 必填; M1 | H1 | D1 (兼容 1m | 1h | 1d)
# start_date = "2024-01-01" # 可选, 格式 YYYY-MM-DD
# end_date = "2024-12-31" # 可选, 含当日
