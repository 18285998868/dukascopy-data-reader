[workspace]

[package]
name = "dukascopy-data-reader"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["NautilusTrader Developer"]
license = "MIT"
description = "Load Dukascopy public archive candles into column vectors."

[lib]
name = "dukascopy_data_reader"
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1", features = ["log"] }
thiserror = "2"
rayon = "1"
lzma-rs = "0.3"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[dev-dependencies]
tempfile = "3"
toml = "1.1"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false
strip = "symbols"
